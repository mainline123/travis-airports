<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCJ Live Arrivals</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #001f27;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

body {
    display: flex;
    flex-direction: column;
}

/* =========================
   TOP HEADER
========================= */

.top-header {
    height: 10vh;
    min-height: 100px;
    background: #00333e;
    border-bottom: 3px solid #f5c518;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2vh 3.5vw;
}

.airport-code {
    color: #27d8ff;
    font-size: clamp(38px, 5vw, 76px);
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 0.9;
}

.jamaica {
    color: #ffd324;
    font-size: clamp(13px, 1.3vw, 21px);
    font-weight: 900;
    letter-spacing: 4px;
    margin-top: 10px;
}

.airport-info {
    text-align: right;
}

.return-button {
    display: inline-block;
    border: 2px solid #c5a51b;
    border-radius: 12px;
    padding: 7px 30px;
    margin-bottom: 8px;
    color: white;
    font-size: clamp(12px, 1.1vw, 18px);
    font-weight: 900;
    text-decoration: none;
    background: rgba(197,165,27,.12);
}

.airport-name {
    font-size: clamp(15px, 1.35vw, 23px);
    font-weight: 900;
}

.location {
    color: #ffd324;
    font-size: clamp(12px, 1.1vw, 18px);
    font-weight: 800;
    margin-top: 3px;
}

.live {
    color: #25df72;
    font-size: clamp(11px, 1vw, 17px);
    font-weight: 900;
    margin-top: 4px;
}

/* =========================
   CLOCK BAR
========================= */

.clock-bar {
    height: 5vh;
    min-height: 55px;
    background: #00333e;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 3.5vw;
    border-bottom: 1px solid #146174;
}

.clock {
    color: #ffd324;
    font-size: clamp(20px, 2vw, 32px);
    font-weight: 900;
}

.clock small {
    color: #d8e5e8;
    font-size: .48em;
    margin-left: 8px;
}

.date {
    font-size: clamp(14px, 1.25vw, 21px);
    font-weight: 800;
}

/* =========================
   ARRIVALS TITLE
========================= */

.section-title {
    height: 5vh;
    min-height: 58px;
    background: #004556;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 3.5vw;
    border-bottom: 2px solid #20d8f7;
}

.section-title h1 {
    font-size: clamp(27px, 2.7vw, 45px);
    font-weight: 900;
    letter-spacing: 1px;
}

.source {
    color: #25df72;
    font-size: clamp(11px, 1vw, 17px);
    font-weight: 900;
}

/* =========================
   TABLE
========================= */

.table-header,
.flight-row {
    display: grid;
    grid-template-columns: 3.3fr 2.1fr .7fr .7fr 1.35fr 1.35fr;
    align-items: center;
}

.table-header {
    height: 4vh;
    min-height: 46px;
    padding: 0 1.5vw;
    background: #064151;
    color: #32ddff;
    font-size: clamp(11px, 1vw, 17px);
    font-weight: 900;
    border-bottom: 1px solid #236474;
}

.flight-list {
    flex: 1;
    overflow: hidden;
    background: #001f27;
}

.flight-row {
    min-height: 6vh;
    padding: 0 1.5vw;
    border-bottom: 1px solid #17434c;
    font-size: clamp(14px, 1.25vw, 22px);
    font-weight: 800;
}

.flight-row:nth-child(even) {
    background: #07313c;
}

.flight-row:nth-child(odd) {
    background: #002a33;
}

.flight {
    display: flex;
    align-items: center;
    gap: 12px;
}

.airline-logo {
    width: 42px;
    height: 42px;
    object-fit: contain;
    background: white;
    border-radius: 7px;
    padding: 3px;
}

.time {
    color: #ffd324;
    font-weight: 900;
}

.status {
    font-weight: 900;
}

.status.green {
    color: #27df77;
}

.status.orange {
    color: #ffb52b;
}

.status.red {
    color: #ff5252;
}

.status.blue {
    color: #4ed6ff;
}

/* =========================
   EMPTY / ERROR STATE
========================= */

.empty-state {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #d9e3e7;
    font-size: clamp(28px, 3vw, 52px);
    font-weight: 900;
    letter-spacing: 3px;
}

.footer {
    height: 3vh;
    min-height: 34px;
    background: #002c36;
    border-top: 1px solid #17434c;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 3.5vw;
    font-size: clamp(10px, .8vw, 14px);
    color: #a9c2c8;
}

/* =========================
   KIOSK
========================= */

body {
    user-select: none;
    -webkit-user-select: none;
}

</style>
</head>

<body>

<header class="top-header">

    <div>
        <div class="airport-code">OCJ</div>
        <div class="jamaica">JAMAICA</div>
    </div>

    <div class="airport-info">
        <a class="return-button" href="index.html">← RETURN TO MENU</a>
        <div class="airport-name">IAN FLEMING INTERNATIONAL AIRPORT</div>
        <div class="location">OCHO RIOS • JAMAICA</div>
        <div class="live">● LIVE FLIGHT DATA</div>
    </div>

</header>


<div class="clock-bar">
    <div class="clock">
        <span id="clock">--:--:--</span>
        <small>JAMAICA (LOCAL)</small>
    </div>

    <div class="date" id="date"></div>
</div>


<div class="section-title">
    <h1>ARRIVALS ✈</h1>
    <div class="source">FLIGHTSTATS DATA</div>
</div>


<div class="table-header">
    <div>AIRLINE / FLIGHT</div>
    <div>FROM</div>
    <div>BAG</div>
    <div>GATE</div>
    <div>TIME</div>
    <div>STATUS</div>
</div>


<div class="flight-list" id="flightList">
    <div class="empty-state">LOADING LIVE ARRIVALS...</div>
</div>


<div class="footer">
    <div>Source: FlightStats</div>
    <div id="updated">Checking live data...</div>
</div>


<script>

const DATA_URL =
    "https://mainline123.github.io/travis-airports_landscape/pot-arrivals.json";

const MAX_ROWS = 30;


/* =========================
   JAMAICA CLOCK
========================= */

function updateClock() {

    const now = new Date();

    const time = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Jamaica",
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
    }).format(now);

    const date = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Jamaica",
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric"
    }).format(now);

    document.getElementById("clock").textContent = time;
    document.getElementById("date").textContent = date;
}

updateClock();
setInterval(updateClock, 1000);


/* =========================
   AIRLINE LOGOS
========================= */

const airlineLogos = {
    "AA":"AAL",
    "AC":"ACA",
    "5Y":"GTI",
    "B6":"JBU",
    "BA":"BAW",
    "BW":"BWA",
    "CM":"CMP",
    "DL":"DAL",
    "UA":"UAL",
    "WS":"WJA",
    "VS":"VIR",
    "KX":"CAY",
    "JY":"IWY",
    "F8":"FLE",
    "NK":"NKS",
    "DWI":"DWI",
    "TXG":"TXG",
    "GAO":"GAO",
    "MQ":"ENY"
};

const LOGO_BASE =
    "https://raw.githubusercontent.com/imgmongelli/airlines-logos-dataset/master/images/";

function getLogo(code) {

    const airline = airlineLogos[code];

    if (!airline) return "";

    return LOGO_BASE + encodeURIComponent(airline) + ".png";
}


/* =========================
   DISPLAY HELPERS
========================= */

function clean(value) {

    if (value === null || value === undefined || value === "") {
        return "—";
    }

    return value;
}


function getStatusClass(status) {

    const text = String(status || "").toLowerCase();

    if (
        text.includes("cancel") ||
        text.includes("divert")
    ) return "red";

    if (
        text.includes("delay")
    ) return "orange";

    if (
        text.includes("land") ||
        text.includes("arriv")
    ) return "blue";

    return "green";
}


function flightName(flight) {

    if (flight.flight) return flight.flight;

    return (
        (flight.airlineCode || "") +
        (flight.flightNumber || "")
    ) || "—";
}


function liveStatus(flight) {

    if (flight.actualTime) {
        return flight.actualTime + " • Landed";
    }

    if (flight.estimatedTime) {
        return flight.estimatedTime + " EST";
    }

    return clean(flight.status);
}


/* =========================
   RENDER FLIGHTS
========================= */

function renderFlights(flights) {

    const list = document.getElementById("flightList");

    list.innerHTML = "";

    if (!Array.isArray(flights) || flights.length === 0) {

        list.innerHTML =
            '<div class="empty-state">NO SCHEDULED ARRIVALS</div>';

        return;
    }

    flights.slice(0, MAX_ROWS).forEach(f => {

        const row = document.createElement("div");
        row.className = "flight-row";

        const logo = getLogo(f.airlineCode);

        const airlineText =
            clean(f.airline) + " " + flightName(f);

        const from =
            f.city && f.airportCode
                ? f.city + " (" + f.airportCode + ")"
                : clean(f.city || f.airportCode);

        const statusText = liveStatus(f);

        row.innerHTML = `
            <div class="flight">
                ${logo
                    ? `<img class="airline-logo"
                         src="${logo}"
                         alt=""
                         onerror="this.style.display='none'">`
                    : ""
                }
                <span>${airlineText}</span>
            </div>

            <div>${from}</div>

            <div>${clean(f.baggage)}</div>

            <div>${clean(f.gate)}</div>

            <div class="time">
                ${clean(f.scheduledTime)}
            </div>

            <div class="status ${getStatusClass(statusText)}">
                ${statusText}
            </div>
        `;

        list.appendChild(row);
    });
}


/* =========================
   UPDATED TIME
========================= */

function showUpdated(updated) {

    const element = document.getElementById("updated");

    if (!updated) {
        element.textContent = "LIVE DATA";
        return;
    }

    const date = new Date(updated);

    const formatted =
        new Intl.DateTimeFormat("en-US", {
            timeZone: "America/Jamaica",
            hour: "numeric",
            minute: "2-digit",
            hour12: true
        }).format(date);

    element.textContent =
        "DATA UPDATED " + formatted + " JAMAICA";
}


/* =========================
   LOAD LIVE JSON
========================= */

async function loadFlights() {

    try {

        const response = await fetch(
            DATA_URL + "?v=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data = await response.json();

        const flights =
            Array.isArray(data.flights)
                ? data.flights
                : [];

        renderFlights(flights);

        showUpdated(data.updated);

    }

    catch (error) {

        console.error(
            "OCJ arrivals data error:",
            error
        );

        document.getElementById("flightList").innerHTML =
            '<div class="empty-state">ARRIVAL DATA TEMPORARILY UNAVAILABLE</div>';

        document.getElementById("updated").textContent =
            "LIVE DATA TEMPORARILY UNAVAILABLE";
    }
}


/* Load immediately */
loadFlights();

/* Check the live JSON every minute */
setInterval(loadFlights, 60000);


/* =========================
   KIOSK PROTECTION
========================= */

document.addEventListener("contextmenu", e => {
    e.preventDefault();
});

document.addEventListener("dragstart", e => {
    e.preventDefault();
});

</script>

</body>
</html>
